name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate + package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json parses
        run: |
          python3 -c "import json,sys; json.load(open('manifest.json')); print('manifest.json OK')"

      - name: Check required files exist
        run: |
          for f in manifest.json popup.html script.js style.css logo.png; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "all extension files present"

      - name: Package extension zip
        run: |
          zip -r gitanest.zip manifest.json popup.html script.js style.css logo.png

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitanest-extension
          path: gitanest.zip
